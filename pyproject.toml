[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "scopus-affiliation-analyzer"
version = "0.3.0"
description = "Multi-page Streamlit dashboard for Scopus metadata analytics, full-text keyword extraction, monochrome print-ready A4 reports, and batch RIS exports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SCOPUS Affiliation Analyzer Contributors" },
]
keywords = [
    "scopus",
    "bibliometrics",
    "affiliation",
    "academia",
    "industry",
    "full-text",
    "ris",
    "rispy",
    "scientometrics",
    "streamlit",
    "FAIR",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "streamlit>=1.30",
    "pandas>=2.0",
    "plotly>=5.18",
    "python-dotenv>=1.0",
    "pybliometrics>=3.6",
    "beautifulsoup4>=4.12.0",
    "rispy>=0.10.0",
    "kaleido>=0.2.1",
    "networkx>=3.0",
]

[project.urls]
Homepage = "https://github.com/OWNER/scopus-affiliation-analyzer"
Repository = "https://github.com/OWNER/scopus-affiliation-analyzer"
Issues = "https://github.com/OWNER/scopus-affiliation-analyzer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
